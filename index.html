.c-fc{--c:#2563eb}.c-ag{--c:#b45309}.c-dc{--c:#dc2626}.c-tcp{--c:#7c3aed}.c-t1{--c:#047857}.c-t2{--c:#db2777}.c-cub{--c:#0e7490}

.opt{font-size:1.05rem;padding:12px}.bar i{background:var(--c,var(--pri))}

const $=s=>document.querySelector(s);
let C={
fc:{n:"Factor común",tip:"Mira si <b>todos</b> los términos comparten un número o una letra.",st:["Halla el MCD de los coeficientes.","Toma las letras comunes con el <b>menor</b> exponente.","Divide cada término entre ese factor común.","Escribe: factor común × (cocientes)."],ex:"12x³ + 18x² = 6x²(2x + 3)",sug:"Practica hallando el MCD y dividiendo término a término; luego multiplica para comprobar."},
ag:{n:"Agrupación de términos",tip:"Hay <b>4 términos</b> (o más) y no existe un factor común para todos.",st:["Agrupa de a dos términos que compartan algo.","Saca factor común en cada grupo.","Debe quedar el <b>mismo paréntesis</b> repetido.","Saca ese paréntesis como factor común."],ex:"ax + ay + bx + by = a(x + y) + b(x + y) = (x + y)(a + b)",sug:"Cuida los signos al agrupar: si el grupo empieza con signo negativo, saca el factor con signo negativo."},
dc:{n:"Diferencia de cuadrados",tip:"<b>Dos términos</b> separados por una <b>resta</b>, y ambos son cuadrados perfectos. (La suma de cuadrados no se factoriza.)",st:["Saca la raíz cuadrada del primer término.","Saca la raíz cuadrada del segundo término.","Escribe (suma)(resta) de las raíces."],ex:"16a² − 25b² = (4a + 5b)(4a − 5b)",sug:"Memoriza los cuadrados perfectos (1, 4, 9, 16, 25…) y recuerda: un factor con + y otro con −."},
tcp:{n:"Trinomio cuadrado perfecto",tip:"<b>Tres términos</b>: el primero y el último son cuadrados perfectos, y el del medio es el <b>doble producto</b> de sus raíces.",st:["Saca la raíz del primer y del tercer término.","Comprueba que 2 · raíz₁ · raíz₂ = término del medio.","Escribe (raíz₁ ± raíz₂)² con el signo del término del medio."],ex:"9a² − 12a + 4 = (3a − 2)²",sug:"Verifica siempre el doble producto; si no coincide, no es un trinomio cuadrado perfecto."},
t1:{n:"Trinomio x² + bx + c",tip:"<b>Tres términos</b> y el coeficiente de x² es <b>1</b>.",st:["Busca dos números que <b>multiplicados</b> den c.","Esos mismos números deben <b>sumar</b> b.","Escribe (x + p)(x + q)."],ex:"x² − x − 12 → (−4)(3) = −12 y −4 + 3 = −1 → (x − 4)(x + 3)",sug:"Haz una lista de los pares de factores de c y revisa cuál suma b, cuidando los signos."},
t2:{n:"Trinomio ax² + bx + c",tip:"<b>Tres términos</b> y el coeficiente de x² es <b>distinto de 1</b>.",st:["Multiplica a · c.","Busca dos números que multiplicados den a·c y sumados den b.","Parte el término central con esos dos números.","Factoriza por agrupación."],ex:"2x² + 7x + 3 → a·c = 6; 1 y 6 suman 7 → 2x² + x + 6x + 3 = x(2x + 1) + 3(2x + 1) = (2x + 1)(x + 3)",sug:"Repasa agrupación de términos y el método de a·c; comprueba multiplicando los dos binomios."},
cub:{n:"Suma o diferencia de cubos",tip:"<b>Dos términos</b> que son cubos perfectos (1, 8, 27, 64, x³…) unidos por + o −.",st:["Saca la raíz cúbica de cada término (a y b).","Primer factor: (a ± b), con el mismo signo del enunciado.","Segundo factor: a² ∓ ab + b² (signo contrario en el medio y + al final)."],ex:"x³ − 8 = (x − 2)(x² + 2x + 4)",sug:"Aprende la fórmula de memoria y repasa los cubos perfectos (1, 8, 27, 64, 125)."}
};
let K=Object.keys(C);
/* Taller: [caso, expresión, pasos, resultado] */
let W=[
["fc","12x³ + 18x²",["MCD de 12 y 18 → 6.","Letra común con menor exponente → x².","Divide: 12x³ ÷ 6x² = 2x y 18x² ÷ 6x² = 3."],"6x²(2x + 3)"],
["fc","20a³b − 30a²b²",["MCD de 20 y 30 → 10.","Letras comunes: a² y b → a²b.","Divide: 20a³b ÷ 10a²b = 2a y 30a²b² ÷ 10a²b = 3b."],"10a²b(2a − 3b)"],
["ag","mx + my + 5x + 5y",["Agrupa: (mx + my) + (5x + 5y).","Factor común en cada grupo: m(x + y) + 5(x + y).","Saca (x + y) como factor común."],"(x + y)(m + 5)"],
["dc","81x² − 4",["√(81x²) = 9x.","√4 = 2.","Escribe (9x + 2)(9x − 2)."],"(9x + 2)(9x − 2)"],
["tcp","x² + 14x + 49",["√x² = x y √49 = 7.","Doble producto: 2·x·7 = 14x ✔ (coincide).","Signo del medio +, entonces (x + 7)²."],"(x + 7)²"],
["t1","x² + 3x − 10",["Dos números que multiplicados den −10 y sumados 3.","Prueba: 5 y −2 → 5·(−2) = −10 y 5 + (−2) = 3 ✔.","Escribe (x + 5)(x − 2)."],"(x + 5)(x − 2)"],
["t2","6x² + 7x + 2",["a·c = 12.","Busca dos números: multiplican 12 y suman 7 → 3 y 4.","Parte: 6x² + 3x + 4x + 2.","Agrupa: 3x(2x + 1) + 2(2x + 1)."],"(2x + 1)(3x + 2)"],
["cub","8x³ + 1",["Raíces cúbicas: ∛(8x³) = 2x y ∛1 = 1.","Primer factor: (2x + 1).","Segundo: (2x)² − (2x)(1) + 1² = 4x² − 2x + 1."],"(2x + 1)(4x² − 2x + 1)"],
["dc","2x² − 50 (¡combina casos!)",["Primero factor común: 2(x² − 25).","Dentro del paréntesis hay diferencia de cuadrados: x² − 25 = (x + 5)(x − 5)."],"2(x + 5)(x − 5)"]
];
/* Evaluación: [caso, pregunta, opciones, índice correcto] */
let Q=[
["fc","Al factorizar 12x³ + 18x², el resultado es:",["6x(2x² + 3)","6x²(2x + 3)","2x²(6x + 9)","6x²(2x + 18)"],1],
["fc","Factoriza 15a²b − 20ab²:",["5ab(3b − 4a)","5ab(3a + 4b)","5ab(3a − 4b)","5b(3a − 4a²)"],2],
["fc","El factor común de 8m³n² y 12m²n⁴ es:",["4m²n²","8m²n²","4m³n⁴","2mn"],0],
["ag","ax + ay + bx + by se factoriza como:",["(a + x)(b + y)","(a + b)(x − y)","(a + b)(x + y)","a(x + y) + b(x − y)"],2],
["ag","Factoriza 2x + 2y + mx + my:",["(x + y)(2 + m)","(2 + m)(x − y)","(2x + m)(y)","2m(x + y)"],0],
["ag","Factoriza xy − 2y + 3x − 6:",["(x + 2)(y + 3)","(x − 2)(y − 3)","(x − 2)(y + 3)","(x + 3)(y − 2)"],2],
["dc","x² − 49 =",["(x − 7)²","(x + 7)(x − 7)","(x + 49)(x − 1)","(x + 7)²"],1],
["dc","16a² − 25b² =",["(4a + 5b)(4a − 5b)","(8a + 5b)(2a − 5b)","(4a − 5b)²","(16a + 25b)(a − b)"],0],
["dc","¿Cuál de estas expresiones NO es una diferencia de cuadrados?",["25 − y²","4x² − 1","x² + 9","x² − 9"],2],
["tcp","x² + 10x + 25 =",["(x + 5)²","(x + 10)(x + 25)","(x − 5)²","(x + 5)(x − 5)"],0],
["tcp","9a² − 12a + 4 =",["(3a + 2)²","(9a − 4)²","(3a − 2)(3a + 2)","(3a − 2)²"],3],
["tcp","¿Cuál es un trinomio cuadrado perfecto?",["x² + 6x + 8","x² + 5x + 9","x² + 6x + 9","x² + 6x + 10"],2],
["t1","x² + 7x + 12 =",["(x + 2)(x + 6)","(x + 3)(x + 4)","(x + 1)(x + 12)","(x − 3)(x − 4)"],1],
["t1","x² − x − 12 =",["(x − 4)(x + 3)","(x + 4)(x − 3)","(x − 6)(x + 2)","(x − 12)(x + 1)"],0],
["t1","x² − 8x + 15 =",["(x + 3)(x + 5)","(x − 3)(x + 5)","(x − 3)(x − 5)","(x − 1)(x − 15)"],2],
["t2","2x² + 7x + 3 =",["(2x + 3)(x + 1)","(2x + 1)(x + 3)","(2x − 1)(x − 3)","(x + 1)(x + 6)"],1],
["t2","3x² − 5x − 2 =",["(3x + 1)(x − 2)","(3x − 1)(x + 2)","(3x − 2)(x + 1)","(3x + 2)(x − 1)"],0],
["cub","x³ − 8 =",["(x − 2)(x² − 2x + 4)","(x − 2)(x² + 4x + 4)","(x + 2)(x² − 2x + 4)","(x − 2)(x² + 2x + 4)"],3],
["cub","a³ + 27 =",["(a + 3)(a² − 3a + 9)","(a + 3)(a² + 3a + 9)","(a − 3)(a² + 3a + 9)","(a + 3)³"],0],
["dc","Factoriza completamente 3x² − 27:",["3(x − 3)²","(3x + 3)(x − 9)","3(x² − 9)","3(x + 3)(x − 3)"],3]
];
/* Ejercicios interactivos: [caso, expresión, respuesta, pista] */
let A=[
["fc","4x + 8","4(x+2)","Busca el MCD de 4 y 8."],
["fc","9a² − 6a","3a(3a-2)","MCD = 3 y la letra a."],
["fc","10x³y² + 15x²y","5x²y(2xy+3)","Menor exponente de cada letra."],
["fc","14m² − 21m","7m(2m-3)","MCD de 14 y 21 es 7."],
["ag","am + an + bm + bn","(m+n)(a+b)","Agrupa (am + an) y (bm + bn)."],
["ag","x² + xy + 3x + 3y","(x+y)(x+3)","Agrupa x(x + y) + 3(x + y)."],
["dc","x² − 81","(x+9)(x-9)","√81 = 9."],
["dc","4m² − 9","(2m+3)(2m-3)","√(4m²) = 2m."],
["dc","49 − y²","(7+y)(7-y)","Raíces: 7 y y."],
["dc","25x² − 36y²","(5x+6y)(5x-6y)","Raíces: 5x y 6y."],
["tcp","x² + 8x + 16","(x+4)^2","2·x·4 = 8x ✔."],
["tcp","4a² − 20a + 25","(2a-5)^2","Raíces: 2a y 5; el medio es negativo."],
["tcp","9x² + 30x + 25","(3x+5)^2","Raíces: 3x y 5."],
["t1","x² + 5x + 6","(x+2)(x+3)","Multiplican 6 y suman 5."],
["t1","x² + 2x − 15","(x+5)(x-3)","Multiplican −15 y suman 2."],
["t1","x² − 9x + 20","(x-4)(x-5)","Multiplican 20 y suman −9."],
["t2","2x² + 5x + 2","(2x+1)(x+2)","a·c = 4; busca dos números que sumen 5."],
["t2","6x² + 5x + 1","(3x+1)(2x+1)","a·c = 6; los números son 2 y 3."],
["cub","x³ + 1","(x+1)(x^2-x+1)","a = x, b = 1."],
["cub","27a³ − 8","(3a-2)(9a^2+6a+4)","a = 3a, b = 2."]
];
let R={q:{},a:{}},NF=0,IN='';
const lbl=n=>{const t=n.toString();return t};
/* normalización de respuestas */
function norm(s){
 s=s.toLowerCase().replace(/[−–—]/g,"-").replace(/²/g,"^2").replace(/³/g,"^3").replace(/[\s*·]/g,"");
 const toks=s.match(/\([^)]*\)(\^\d)?|[^()]+/g)||[];
 return toks.map(t=>t.replace(/\(([^)]*)\)/,(m,i)=>{
   if(!/^[+-]/.test(i))i="+"+i;
   return "("+i.split(/(?=[+-])/).sort().join("")+")";
 })).sort().join("|");

/* NAV */
const tabs=[["teoria","📖 Teoría"],["taller","✏️ Taller"],["eval","📝 Evaluación"],["act","🎯 Ejercicios"],["nota","🏆 Nota"]];

let V={

ag:["🧩",`<span class="chip">ax+ay</span> | <span class="chip">bx+by</span> ➜ (<span class="chip f">x+y</span>)(a+b)`],

/* TEORÍA */
const IN1=`<div class="card"><h3>🔎 ¿Cómo reconocer el caso? Cuenta los términos</h3>
<table><tr><th>Términos</th><th>Posibles casos</th></tr>
<tr><td>2</td><td>Factor común · Diferencia de cuadrados · Suma/diferencia de cubos</td></tr>

function rT(){$("#teoria").innerHTML=IN+K.map((k,i)=>{const c=C[k],v=V[k];return `<div class="card cs c-${k}"><div class="hd"><span class="ico">${v[0]}</span><h3>${i+1}. ${c.n}</h3></div><div class="tip">💡 <b>¿Cómo lo reconozco?</b> ${c.tip}</div><div class="vis">${v[1]}</div><b>Paso a paso:</b><ol class="stp">${c.st.map(s=>`<li><span>${s}</span></li>`).join("")}</ol><div class="ex">📌 ${c.ex}</div><p><button class="listen" data-k="${k}">🔊 Escuchar</button></p></div>`}).join("")}
